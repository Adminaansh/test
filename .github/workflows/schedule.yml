name: Scheduled Python Script

on:
  schedule:
    # Runs at 03:30 UTC (9:00 AM IST) Monday through Saturday
    - cron: '30 3 * * 1-6'
    # Runs at 09:30 UTC (3:00 PM IST) Monday through Saturday
    - cron: '30 9 * * 1-6'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Selenium Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager

      - name: Execute Python Script
        run: python N_update.py --resume "./Resume.pdf" --headless
